services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12-alpine
    container_name: hma-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: hma
      CLICKHOUSE_USER: hma
      CLICKHOUSE_PASSWORD: hma
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-data:
